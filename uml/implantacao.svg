<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="790" viewBox="0 0 1440 790"><defs><marker id="setaCheia" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0 0 L11 4.5 L0 9 Z" fill="#475569"/></marker><style>text{font-family:Arial,Helvetica,sans-serif}</style></defs><rect width="1440" height="790" fill="#FFFFFF"/><text x="40" y="44" font-size="25" font-weight="bold" fill="#0F172A">Diagrama de Implantação — ConectaGlobal</text><text x="40" y="70" font-size="14.5" fill="#475569">Topologia proposta. O ambiente real de hospedagem não foi definido nesta etapa acadêmica (RNF-26).</text><path d="M90,210 l18,-18 l290,0 l0,220 l-18,18 Z" fill="#E8F2FF" stroke="#2563A8" stroke-width="2" opacity="0.5"/><path d="M380,210 l18,-18 l0,220 l-18,18 Z" fill="#E8F2FF" stroke="#2563A8" stroke-width="2" opacity="0.75"/><rect x="90" y="210" width="290" height="220" fill="#E8F2FF" stroke="#2563A8" stroke-width="2"/><text x="235" y="236" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#0F172A">Dispositivo do usuário</text><rect x="115" y="256" width="240" height="58" rx="6" fill="#F3F8FF" stroke="#2563A8" stroke-width="1.8"/><path d="M327,266 l12,0 l5,5 l0,11 l-17,0 Z M339,266 l0,5 l5,0" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.3"/><text x="235" y="289.0" text-anchor="middle" font-size="12.5" fill="#1F2937">Navegador ou aplicativo</text><rect x="115" y="336" width="240" height="58" rx="6" fill="#F3F8FF" stroke="#2563A8" stroke-width="1.8"/><path d="M327,346 l12,0 l5,5 l0,11 l-17,0 Z M339,346 l0,5 l5,0" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.3"/><text x="235" y="369.0" text-anchor="middle" font-size="12.5" fill="#1F2937">Interface ConectaGlobal</text><path d="M520,150 l18,-18 l440,0 l0,390 l-18,18 Z" fill="#EAF7F0" stroke="#2F7D55" stroke-width="2" opacity="0.5"/><path d="M960,150 l18,-18 l0,390 l-18,18 Z" fill="#EAF7F0" stroke="#2F7D55" stroke-width="2" opacity="0.75"/><rect x="520" y="150" width="440" height="390" fill="#EAF7F0" stroke="#2F7D55" stroke-width="2"/><text x="740" y="176" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#0F172A">Ambiente de aplicação proposto</text><path d="M548,196 l18,-18 l384,0 l0,112 l-18,18 Z" fill="#F6FBF8" stroke="#2F7D55" stroke-width="2" opacity="0.5"/><path d="M932,196 l18,-18 l0,112 l-18,18 Z" fill="#F6FBF8" stroke="#2F7D55" stroke-width="2" opacity="0.75"/><rect x="548" y="196" width="384" height="112" fill="#F6FBF8" stroke="#2F7D55" stroke-width="2"/><text x="740" y="222" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#0F172A">Servidor web</text><rect x="572" y="238" width="336" height="52" rx="6" fill="#F6FBF8" stroke="#2F7D55" stroke-width="1.8"/><path d="M880,248 l12,0 l5,5 l0,11 l-17,0 Z M892,248 l0,5 l5,0" fill="#FFFFFF" stroke="#2F7D55" stroke-width="1.3"/><text x="740" y="268.0" text-anchor="middle" font-size="12.5" fill="#1F2937">Aplicação Web (front-end)</text><path d="M548,360 l18,-18 l384,0 l0,150 l-18,18 Z" fill="#F6FBF8" stroke="#2F7D55" stroke-width="2" opacity="0.5"/><path d="M932,360 l18,-18 l0,150 l-18,18 Z" fill="#F6FBF8" stroke="#2F7D55" stroke-width="2" opacity="0.75"/><rect x="548" y="360" width="384" height="150" fill="#F6FBF8" stroke="#2F7D55" stroke-width="2"/><text x="740" y="386" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#0F172A">Servidor de serviços</text><rect x="572" y="400" width="336" height="44" rx="6" fill="#F6FBF8" stroke="#2F7D55" stroke-width="1.8"/><path d="M880,410 l12,0 l5,5 l0,11 l-17,0 Z M892,410 l0,5 l5,0" fill="#FFFFFF" stroke="#2F7D55" stroke-width="1.3"/><text x="740" y="426.0" text-anchor="middle" font-size="12.5" fill="#1F2937">API e serviços de negócio</text><rect x="572" y="454" width="336" height="44" rx="6" fill="#F6FBF8" stroke="#2F7D55" stroke-width="1.8"/><path d="M880,464 l12,0 l5,5 l0,11 l-17,0 Z M892,464 l0,5 l5,0" fill="#FFFFFF" stroke="#2F7D55" stroke-width="1.3"/><text x="740" y="480.0" text-anchor="middle" font-size="12.5" fill="#1F2937">Serviço de autenticação e autorização</text><path d="M1090,210 l18,-18 l290,0 l0,104 l-18,18 Z" fill="#FFF1DF" stroke="#C77B20" stroke-width="2" opacity="0.5"/><path d="M1380,210 l18,-18 l0,104 l-18,18 Z" fill="#FFF1DF" stroke="#C77B20" stroke-width="2" opacity="0.75"/><rect x="1090" y="210" width="290" height="104" fill="#FFF1DF" stroke="#C77B20" stroke-width="2"/><text x="1235" y="236" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#0F172A">Servidor de banco</text><text x="1235" y="268" text-anchor="middle" font-size="13" fill="#653B0B">de dados (proposto)</text><path d="M1090,392 l18,-18 l290,0 l0,104 l-18,18 Z" fill="#FFF1DF" stroke="#C77B20" stroke-width="2" opacity="0.5"/><path d="M1380,392 l18,-18 l0,104 l-18,18 Z" fill="#FFF1DF" stroke="#C77B20" stroke-width="2" opacity="0.75"/><rect x="1090" y="392" width="290" height="104" fill="#FFF1DF" stroke="#C77B20" stroke-width="2"/><text x="1235" y="418" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#0F172A">Serviço de armazenamento</text><text x="1235" y="450" text-anchor="middle" font-size="13" fill="#653B0B">de arquivos (proposto)</text><path d="M380,266 L548,252" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#setaCheia)"/><text x="464" y="249" text-anchor="middle" font-size="12.5" fill="#334155">HTTPS (proposto)</text><path d="M740,308 L740,360" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#setaCheia)"/><text x="740" y="324" text-anchor="middle" font-size="12.5" fill="#334155"></text><text x="756" y="340" font-size="12.5" fill="#334155">HTTPS (proposto)</text><path d="M960,420 L1090,266" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#setaCheia)"/><text x="1025" y="335" text-anchor="middle" font-size="12.5" fill="#334155">conexão segura</text><path d="M960,450 L1090,440" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#setaCheia)"/><text x="1025" y="437" text-anchor="middle" font-size="12.5" fill="#334155">conexão segura</text><rect x="90" y="572" width="1290" height="112" rx="10" fill="#FFFDF0" stroke="#C9A227"/><text x="112" y="600" font-size="13.5" font-weight="bold" fill="#5B4708">Restrições registradas</text><text x="112" y="626" font-size="13" fill="#5B4708">Nenhuma integração com sistema institucional, SSO ou plataforma de terceiros está confirmada (RNF-18, PQ-05).</text><text x="112" y="648" font-size="13" fill="#5B4708">O método de autenticação permanece a definir (RNF-08); a gestão de sessão segue RNF-27.</text><text x="112" y="670" font-size="13" fill="#5B4708">Metas de desempenho e disponibilidade dependem da definição do ambiente (RNF-01, RNF-02, RNF-06, RNF-26).</text><text x="40" y="766" font-size="13" fill="#475569">Nós em perspectiva representam ambientes de execução; retângulos internos representam artefatos implantados.</text></svg>