<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1558" viewBox="0 0 1100 1558"><defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#333"/></marker><style>text{font-family:Arial,sans-serif;fill:#222}.ttl{font-size:26px;font-weight:bold}.sub{font-size:15px;fill:#555}.act{fill:#EAF2FF;stroke:#3976C8;stroke-width:2}.dec{fill:#FFF1DF;stroke:#C77B20;stroke-width:2}.side{fill:#F4F6F8;stroke:#6B7A8C;stroke-width:2}.nd{fill:#333;stroke:#333}.ring{fill:none;stroke:#333;stroke-width:2}.lbl{font-size:15px}.edge{stroke:#333;stroke-width:2;fill:none;marker-end:url(#arr)}.note{font-size:14px;fill:#444}</style></defs><rect width="1100" height="1558" fill="#fff"/><text x="38" y="44" class="ttl">Atividade — Fluxo de candidatura do estudante</text><text x="38" y="70" class="sub">Fluxo de referência dos CDU-15, CDU-01, CDU-02, CDU-16 e CDU-03. A autoavaliação é indicativa e não impede a candidatura (RN-04).</text><circle class="nd" cx="470.0" cy="110.0" r="16"/><path class="edge" d="M470.0,126.0 L470.0,160.0"/><rect class="act" x="270.0" y="160.0" width="400" height="66" rx="14"/><text x="470.0" y="188.6" text-anchor="middle" font-size="16">Acessar o sistema de forma</text><text x="470.0" y="208.6" text-anchor="middle" font-size="16">identificada (CDU-15)</text><path class="edge" d="M470.0,226.0 L470.0,260.0"/><rect class="act" x="270.0" y="260.0" width="400" height="66" rx="14"/><text x="470.0" y="288.6" text-anchor="middle" font-size="16">Consultar e filtrar oportunidades</text><text x="470.0" y="308.6" text-anchor="middle" font-size="16">publicadas (CDU-01)</text><path class="edge" d="M470.0,326.0 L470.0,360.0"/><rect class="act" x="270.0" y="360.0" width="400" height="66" rx="14"/><text x="470.0" y="388.6" text-anchor="middle" font-size="16">Consultar detalhes: critérios, prazos,</text><text x="470.0" y="408.6" text-anchor="middle" font-size="16">benefícios e documentos</text><path class="edge" d="M470.0,426.0 L470.0,460.0"/><rect class="act" x="270.0" y="460.0" width="400" height="66" rx="14"/><text x="470.0" y="498.6" text-anchor="middle" font-size="16">Verificar elegibilidade inicial (CDU-02)</text><path class="edge" d="M470.0,526.0 L470.0,560.0"/><rect class="act" x="270.0" y="560.0" width="400" height="66" rx="14"/><text x="470.0" y="588.6" text-anchor="middle" font-size="16">Sistema apresenta resultado indicativo</text><text x="470.0" y="608.6" text-anchor="middle" font-size="16">e informa que não é decisão oficial (RN-04)</text><path class="edge" d="M470.0,626.0 L470.0,660.0"/><polygon class="dec" points="470.0,660.0 630.0,719.0 470.0,778.0 310.0,719.0"/><text x="470.0" y="714.8" text-anchor="middle" font-size="15">Estudante decide</text><text x="470.0" y="733.8" text-anchor="middle" font-size="15">candidatar-se?</text><path class="edge" d="M630.0,719.0 L862.0,719.0 L862.0,753.0"/><text x="746.0" y="709.0" class="lbl" text-anchor="middle">Não</text><rect class="side" x="697.0" y="753.0" width="330" height="66" rx="14"/><text x="862.0" y="781.6" text-anchor="middle" font-size="16">Consultar outra oportunidade</text><text x="862.0" y="801.6" text-anchor="middle" font-size="16">ou encerrar</text><path class="edge" d="M862.0,819.0 L862.0,853.0"/><circle class="ring" cx="862.0" cy="870.0" r="17"/><circle class="nd" cx="862.0" cy="870.0" r="10"/><text x="446.0" y="800.0" class="lbl" text-anchor="middle">Sim</text><path class="edge" d="M470.0,778.0 L470.0,812.0"/><rect class="act" x="270.0" y="812.0" width="400" height="66" rx="14"/><text x="470.0" y="840.6" text-anchor="middle" font-size="16">Reaproveitar dados e documentos</text><text x="470.0" y="860.6" text-anchor="middle" font-size="16">do portfólio (CDU-16)</text><path class="edge" d="M470.0,878.0 L470.0,912.0"/><rect class="act" x="270.0" y="912.0" width="400" height="66" rx="14"/><text x="470.0" y="940.6" text-anchor="middle" font-size="16">Complementar dados e anexar</text><text x="470.0" y="960.6" text-anchor="middle" font-size="16">documentos exigidos (RN-06)</text><path class="edge" d="M470.0,978.0 L470.0,1012.0"/><rect class="act" x="270.0" y="1012.0" width="400" height="66" rx="14"/><text x="470.0" y="1050.6" text-anchor="middle" font-size="16">Enviar candidatura (CDU-03)</text><path class="edge" d="M470.0,1078.0 L470.0,1112.0"/><polygon class="dec" points="470.0,1112.0 630.0,1171.0 470.0,1230.0 310.0,1171.0"/><text x="470.0" y="1166.8" text-anchor="middle" font-size="15">Dentro do prazo</text><text x="470.0" y="1185.8" text-anchor="middle" font-size="15">cadastrado? (RN-09)</text><path class="edge" d="M630.0,1171.0 L862.0,1171.0 L862.0,1205.0"/><text x="746.0" y="1161.0" class="lbl" text-anchor="middle">Não</text><rect class="side" x="697.0" y="1205.0" width="330" height="66" rx="14"/><text x="862.0" y="1233.6" text-anchor="middle" font-size="16">Sistema informa prazo encerrado</text><text x="862.0" y="1253.6" text-anchor="middle" font-size="16">e não registra a candidatura</text><path class="edge" d="M862.0,1271.0 L862.0,1305.0"/><circle class="ring" cx="862.0" cy="1322.0" r="17"/><circle class="nd" cx="862.0" cy="1322.0" r="10"/><text x="446.0" y="1252.0" class="lbl" text-anchor="middle">Sim</text><path class="edge" d="M470.0,1230.0 L470.0,1264.0"/><rect class="act" x="270.0" y="1264.0" width="400" height="66" rx="14"/><text x="470.0" y="1292.6" text-anchor="middle" font-size="16">Registrar candidatura vinculada</text><text x="470.0" y="1312.6" text-anchor="middle" font-size="16">à oportunidade publicada (RN-05)</text><path class="edge" d="M470.0,1330.0 L470.0,1364.0"/><rect class="act" x="270.0" y="1364.0" width="400" height="66" rx="14"/><text x="470.0" y="1392.6" text-anchor="middle" font-size="16">Apresentar situação inicial, pendências</text><text x="470.0" y="1412.6" text-anchor="middle" font-size="16">e histórico (CDU-04)</text><path class="edge" d="M470.0,1430.0 L470.0,1464.0"/><circle class="ring" cx="470.0" cy="1481.0" r="17"/><circle class="nd" cx="470.0" cy="1481.0" r="10"/></svg>