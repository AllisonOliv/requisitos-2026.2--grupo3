<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1258" viewBox="0 0 1100 1258"><defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#333"/></marker><style>text{font-family:Arial,sans-serif;fill:#222}.ttl{font-size:26px;font-weight:bold}.sub{font-size:15px;fill:#555}.act{fill:#EAF2FF;stroke:#3976C8;stroke-width:2}.dec{fill:#FFF1DF;stroke:#C77B20;stroke-width:2}.side{fill:#F4F6F8;stroke:#6B7A8C;stroke-width:2}.nd{fill:#333;stroke:#333}.ring{fill:none;stroke:#333;stroke-width:2}.lbl{font-size:15px}.edge{stroke:#333;stroke-width:2;fill:none;marker-end:url(#arr)}.note{font-size:14px;fill:#444}</style></defs><rect width="1100" height="1258" fill="#fff"/><text x="38" y="44" class="ttl">Atividade — Pós-intercâmbio, colaboração e moderação</text><text x="38" y="70" class="sub">Fluxo de referência dos CDU-11, CDU-12, CDU-13, CDU-17 e CDU-18. Conteúdo publicável só fica visível após decisão registrada (RN-12, RN-18).</text><circle class="nd" cx="470.0" cy="110.0" r="16"/><path class="edge" d="M470.0,126.0 L470.0,160.0"/><rect class="act" x="270.0" y="160.0" width="400" height="66" rx="14"/><text x="470.0" y="188.6" text-anchor="middle" font-size="16">Acessar área de pós-intercâmbio</text><text x="470.0" y="208.6" text-anchor="middle" font-size="16">e colaboração (CDU-15)</text><path class="edge" d="M470.0,226.0 L470.0,260.0"/><rect class="act" x="270.0" y="260.0" width="400" height="66" rx="14"/><text x="470.0" y="288.6" text-anchor="middle" font-size="16">Selecionar atividade: relato, mentoria,</text><text x="470.0" y="308.6" text-anchor="middle" font-size="16">Tandem, evento, fórum ou integração</text><path class="edge" d="M470.0,326.0 L470.0,360.0"/><polygon class="dec" points="470.0,360.0 630.0,419.0 470.0,478.0 310.0,419.0"/><text x="470.0" y="414.8" text-anchor="middle" font-size="15">A atividade gera</text><text x="470.0" y="433.8" text-anchor="middle" font-size="15">conteúdo publicável?</text><path class="edge" d="M630.0,419.0 L862.0,419.0 L862.0,453.0"/><text x="746.0" y="409.0" class="lbl" text-anchor="middle">Não</text><rect class="side" x="697.0" y="453.0" width="330" height="66" rx="14"/><text x="862.0" y="481.6" text-anchor="middle" font-size="16">Executar a atividade escolhida</text><text x="862.0" y="501.6" text-anchor="middle" font-size="16">(CDU-12, CDU-13 ou CDU-17)</text><path class="edge" d="M862.0,519.0 L862.0,553.0"/><rect class="side" x="697.0" y="553.0" width="330" height="66" rx="14"/><text x="862.0" y="581.6" text-anchor="middle" font-size="16">Registrar participação ou solicitação</text><text x="862.0" y="601.6" text-anchor="middle" font-size="16">e exibir confirmação</text><path class="edge" d="M862.0,619.0 L862.0,653.0"/><circle class="ring" cx="862.0" cy="670.0" r="17"/><circle class="nd" cx="862.0" cy="670.0" r="10"/><text x="446.0" y="500.0" class="lbl" text-anchor="middle">Sim</text><path class="edge" d="M470.0,478.0 L470.0,512.0"/><rect class="act" x="270.0" y="512.0" width="400" height="66" rx="14"/><text x="470.0" y="550.6" text-anchor="middle" font-size="16">Submeter relato ou publicação (CDU-11)</text><path class="edge" d="M470.0,578.0 L470.0,612.0"/><rect class="act" x="270.0" y="612.0" width="400" height="66" rx="14"/><text x="470.0" y="640.6" text-anchor="middle" font-size="16">Sistema registra a submissão como</text><text x="470.0" y="660.6" text-anchor="middle" font-size="16">pendente e mantém indisponível (RN-12)</text><path class="edge" d="M470.0,678.0 L470.0,712.0"/><rect class="act" x="270.0" y="712.0" width="400" height="66" rx="14"/><text x="470.0" y="740.6" text-anchor="middle" font-size="16">Perfil autorizado analisa</text><text x="470.0" y="760.6" text-anchor="middle" font-size="16">o conteúdo (CDU-18, RN-18)</text><path class="edge" d="M470.0,778.0 L470.0,812.0"/><polygon class="dec" points="470.0,812.0 630.0,871.0 470.0,930.0 310.0,871.0"/><text x="470.0" y="876.2" text-anchor="middle" font-size="15">Conteúdo aprovado?</text><path class="edge" d="M630.0,871.0 L862.0,871.0 L862.0,905.0"/><text x="746.0" y="861.0" class="lbl" text-anchor="middle">Não</text><rect class="side" x="697.0" y="905.0" width="330" height="66" rx="14"/><text x="862.0" y="933.6" text-anchor="middle" font-size="16">Registrar recusa com justificativa</text><text x="862.0" y="953.6" text-anchor="middle" font-size="16">e manter indisponível</text><path class="edge" d="M862.0,971.0 L862.0,1005.0"/><rect class="side" x="697.0" y="1005.0" width="330" height="66" rx="14"/><text x="862.0" y="1043.6" text-anchor="middle" font-size="16">Notificar o autor da decisão</text><path class="edge" d="M862.0,1071.0 L862.0,1105.0"/><circle class="ring" cx="862.0" cy="1122.0" r="17"/><circle class="nd" cx="862.0" cy="1122.0" r="10"/><text x="446.0" y="952.0" class="lbl" text-anchor="middle">Sim</text><path class="edge" d="M470.0,930.0 L470.0,964.0"/><rect class="act" x="270.0" y="964.0" width="400" height="66" rx="14"/><text x="470.0" y="992.6" text-anchor="middle" font-size="16">Publicar conteúdo e torná-lo</text><text x="470.0" y="1012.6" text-anchor="middle" font-size="16">visível aos participantes</text><path class="edge" d="M470.0,1030.0 L470.0,1064.0"/><rect class="act" x="270.0" y="1064.0" width="400" height="66" rx="14"/><text x="470.0" y="1092.6" text-anchor="middle" font-size="16">Notificar o autor da aprovação</text><text x="470.0" y="1112.6" text-anchor="middle" font-size="16">e registrar responsável e data/hora</text><path class="edge" d="M470.0,1130.0 L470.0,1164.0"/><circle class="ring" cx="470.0" cy="1181.0" r="17"/><circle class="nd" cx="470.0" cy="1181.0" r="10"/></svg>